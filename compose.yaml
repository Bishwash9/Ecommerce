name: ecommerce

services:
  database:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ecommerce}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ecommerce_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ecommerce}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" localhost:27017/admin
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: ecommerce-backend:latest
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./apps/backend/.env
        required: true
    environment:
      NODE_ENV: production
      PORT: 5001
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-ecommerce}:${MONGO_ROOT_PASSWORD:-ecommerce_password}@database:27017/${MONGO_DATABASE:-ecommerce}?authSource=admin
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      database:
        condition: service_healthy

  web-users:
    image: ecommerce-web-users:latest
    build:
      context: ./apps/web-users
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5001/api}
    restart: unless-stopped
    environment:
      API_INTERNAL_BASE_URL: http://backend:5001/api
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5001/api}
    ports:
      - "${WEB_USERS_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
